name: Generate modular 4x4 model

on:
  workflow_dispatch:
  push:
    paths:
      - vehicle_model/source_generator.py.br.b64
      - .github/workflows/generate-vehicle.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh generation dependencies
        run: python -m pip install numpy==2.3.5 trimesh==4.11.1 brotli
      - name: Restore original modular 4x4 generator
        run: |
          mkdir -p assets/vehicles
          python - <<'PY'
          import base64, brotli, pathlib
          encoded = pathlib.Path('vehicle_model/source_generator.py.br.b64').read_text().strip()
          original = brotli.decompress(base64.b64decode(encoded))
          pathlib.Path('assets/vehicles/generate_motor_trail_4x4.py').write_bytes(original)
          print('Generator restored:', len(original), 'bytes')
          PY
      - name: Generate original GLB
        run: |
          python assets/vehicles/generate_motor_trail_4x4.py
          python - <<'PY'
          from pathlib import Path
          model = Path('assets/vehicles/motor_trail_4x4.glb')
          assert model.is_file() and model.stat().st_size > 100_000
          print('Generated', model, 'bytes=', model.stat().st_size)
          PY
      - name: Commit exact model and generator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vehicles/generate_motor_trail_4x4.py assets/vehicles/motor_trail_4x4.glb
          if git diff --cached --quiet; then
            echo 'The vehicle model is already up to date.'
          else
            git commit -m 'assets: add original articulated 4x4 GLB and source generator'
            git push
          fi
