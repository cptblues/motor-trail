name: Native Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: motor-trail.exe
            archive: Motor-Trail-Windows-x64.zip
            rustflags: '-C target-feature=+crt-static'
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: motor-trail
            archive: Motor-Trail-macOS-AppleSilicon.zip
            rustflags: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: motor-trail
            archive: Motor-Trail-macOS-Intel.zip
            rustflags: ''
    defaults:
      run:
        shell: bash
    env:
      MOTOR_TRAIL_DISTRIBUTION: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BINARY: ${{ matrix.binary }}
      RELEASE_ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve checked-out release commit
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$release_commit" = "$tag_commit"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Assert native Rust host
        run: |
          rustc -vV
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$RELEASE_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-distribution-${{ matrix.target }}
      - name: Test packaging contracts
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Build native executable
        run: cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Package and validate
        run: >-
          python scripts/package_release.py build
          --binary "target/$RELEASE_TARGET/release/$RELEASE_BINARY"
          --target "$RELEASE_TARGET" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          --output-dir dist
      - name: Smoke test extracted installation from unrelated directory
        run: >-
          python scripts/package_release.py smoke "dist/$RELEASE_ARCHIVE"
          --target "$RELEASE_TARGET" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve checked-out release commit
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$release_commit" = "$tag_commit"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Validate all three archives before creating release
        run: >-
          python scripts/package_release.py validate-all --directory dist
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Create draft, upload all assets, then publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/Motor-Trail-Windows-x64.zip dist/Motor-Trail-macOS-AppleSilicon.zip dist/Motor-Trail-macOS-Intel.zip)
          prerelease=()
          case "${RELEASE_TAG,,}" in
            *alpha*|*beta*|*rc*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
