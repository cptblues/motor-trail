[package]
name = "motor-trail"
version = "0.1.0"
edition = "2024"
description = "Prototype de randonnée 4x4 low-poly avec Bevy et Rapier"
license = "MIT"

[dependencies]
bevy = "=0.19.0"
bevy_rapier3d = "=0.35.0"
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noise = "=0.9.0"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }

[profile.test]
# Full Bevy type symbols are costly to link on Windows.
debug = 1
debug-assertions = true
overflow-checks = true
